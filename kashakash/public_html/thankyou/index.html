<!DOCTYPE html><html lang="en"><head>
<title>You're in | SwitchLab</title>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="../images/coltech-icon.jpg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="robots" content="noindex">
<style>
:root{--bg:#0A0E17;--surface:#10151F;--surface-2:#161D2B;--border:#232C40;--text:#DDE3EE;--muted:#8994AC;--dim:#4F5A73;--green:#3DDC97;--green-dim:#123326;--amber:#F5B94D;--blue:#5FA8F5;--wa:#25D366;--mono:"IBM Plex Mono",monospace;--sans:"IBM Plex Sans",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.top{border-bottom:1px solid var(--border);padding:14px 0;font-family:var(--mono);font-size:13px;color:var(--muted)}
.top .h{color:var(--green)}
h1{font-size:clamp(34px,8vw,52px);line-height:1.1;margin:44px 0 14px;color:#fff;font-weight:700}
.lead{font-size:18px;color:var(--muted);max-width:56ch}
.facts{margin:28px 0;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-family:var(--mono);font-size:14px}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:11px 16px;border-bottom:1px solid var(--border)}
.facts div:last-child{border-bottom:none}
.facts span:first-child{color:var(--dim)}
.facts span:last-child{color:var(--text);text-align:right}
.btn{display:inline-block;background:var(--green);color:#04321c;font-weight:700;font-size:16px;padding:14px 26px;border-radius:8px;border:none;cursor:pointer}
.btn:hover{opacity:.9}.btn.wa{background:var(--wa)}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
h2{font-size:20px;color:#fff;margin:48px 0 14px}
.phase{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--border)}
.phase:last-of-type{border-bottom:1px solid var(--border)}
.phase .d{font-family:var(--mono);font-size:13px;color:var(--amber);padding-top:3px}
.phase b{color:#fff;display:block}.phase p{color:var(--muted);font-size:15px}
ul.who{list-style:none}ul.who li{padding:8px 0 8px 22px;position:relative;color:var(--text)}
ul.who li:before{content:">";position:absolute;left:0;color:var(--green);font-family:var(--mono)}
.by{display:flex;gap:16px;align-items:center;margin-top:12px}
.by img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:top;border:1px solid var(--border)}
.by p{color:var(--muted);font-size:15px}
.foot{margin:56px 0 40px;font-family:var(--mono);font-size:12px;color:var(--dim)}
@media(max-width:520px){.phase{grid-template-columns:1fr;gap:4px}.btn{width:100%;text-align:center}}
</style></head><body>
<div class="top"><div class="wrap"><a href="../"><span class="h">akash@devops</span>:~$ ./<span data-c="name">SwitchLab</span></a></div></div>
<main class="wrap">
<h1>You're registered.</h1>
<p class="lead">Next step: join the WhatsApp community. Reminders, the start date and all updates are shared there.</p>
<div class="facts">
<div><span>starts</span><span data-c="start">1 November 2026</span></div>
<div><span>duration</span><span><span data-c="days">90</span> days</span></div>
</div>
<a class="btn wa" data-wa href="#">Join the WhatsApp community</a>
<p class="foot">Can't join? Message <a href="https://wa.me/918788890770" style="color:var(--green)">Akash on WhatsApp</a>.</p>
</main><script src="../config.js"></script></body></html>
